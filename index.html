<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صفحتي الأولى</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: #333;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 40px 30px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    h1 { color: #4b3c8f; margin-bottom: 12px; font-size: 1.8rem; }
    p { color: #666; line-height: 1.7; margin-bottom: 24px; }

    .counter {
      font-size: 3rem;
      font-weight: bold;
      color: #764ba2;
      margin: 10px 0 20px;
    }

    .buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 24px;
      font-size: 1rem;
      cursor: pointer;
      color: #fff;
      background: #667eea;
      transition: transform 0.1s, background 0.2s;
    }
    button:hover { background: #5a6fd6; }
    button:active { transform: scale(0.96); }
    button.reset { background: #aaa; }
    button.reset:hover { background: #999; }
  </style>
</head>
<body>
  <main class="card">
    <h1>مرحباً بك 👋</h1>
    <p>هذه صفحة ويب بسيطة. جرّب الأزرار أدناه لترى التفاعل.</p>

    <div class="counter" id="counter">0</div>

    <div class="buttons">
      <button id="plus">+1</button>
      <button id="minus">-1</button>
      <button id="reset" class="reset">إعادة</button>
    </div>
  </main>

  <script>
    let count = 0;
    const counterEl = document.getElementById("counter");

    function render() {
      counterEl.textContent = count;
    }

    document.getElementById("plus").addEventListener("click", () => {
      count++;
      render();
    });

    document.getElementById("minus").addEventListener("click", () => {
      count--;
      render();
    });

    document.getElementById("reset").addEventListener("click", () => {
      count = 0;
      render();
    });
  </script>
</body>
</html>
